  <!-- Critical: Fix scroll offset for fixed navbar -->
  <script>
    // Immediate scroll fix - runs before any React code
    (function() {
      // Set CSS variables for scroll offset
      document.documentElement.style.setProperty('--navbar-offset', '100px');
      
      // Handle hash on page load
      if (window.location.hash) {
        window.addEventListener('load', function() {
          const elementId = window.location.hash.substring(1);
          const element = document.getElementById(elementId);
          if (element) {
            const offset = 100; // Navbar height + buffer
            const elementPosition = element.getBoundingClientRect().top + window.pageYOffset;
            window.scrollTo({
              top: elementPosition - offset,
              behavior: 'smooth'
            });
          }
        });
      }
      
      // Intercept all anchor clicks
      document.addEventListener('click', function(e) {
        const target = e.target.closest('a[href^="#"]');
        if (target && target.getAttribute('href') !== '#') {
          const elementId = target.getAttribute('href').substring(1);
          const element = document.getElementById(elementId);
          if (element) {
            e.preventDefault();
            const offset = 100;
            const elementPosition = element.getBoundingClientRect().top + window.pageYOffset;
            window.scrollTo({
              top: elementPosition - offset,
              behavior: 'smooth'
            });
            history.pushState(null, null, `#${elementId}`);
          }
        }
      }, true);
    })();
  </script>
